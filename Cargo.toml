# Rahti's optional native packaging, as its own publishable workspace.
#
# Separate from the framework on purpose. A Rahti project is a web application
# and stays one; nothing here is compiled, downloaded or resolved until
# somebody installs `cargo-rahti-native` and runs `cargo rahti native init`.
# Keeping it in the framework workspace would have made "optional" a claim
# rather than a fact.
[workspace]
resolver = "3"
members = ["crates/cargo-rahti-native", "crates/rahti-native"]

# Inherited by both crates with `field.workspace = true`.
#
# One version across the two, deliberately: `cargo-rahti-native` generates a
# shell that calls functions in `rahti-native`, so a mismatch would be a
# compile error inside generated code. They release together.
#
# Its own release line, independent of the framework's. This package is
# versioned by what *it* changes, not by what `rahti` does — the two are
# separate installs and a user upgrades them separately. Starting at 0.0.1
# says what it is: a first cut of a thing that has not shipped yet.
[workspace.package]
version = "0.0.16"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeffersonabraham/rahti-native"
rust-version = "1.97"

[workspace.dependencies]
# The framework used by the runtime's integration tests. It deliberately is
# not a production dependency: a packaged application already brings its own
# Rahti version, and two copies would have two independent shutdown globals.
# The generated shell signals shutdown through the application's `pub use
# rahti` re-export instead.
#
# The path points at `../rahti`, the publishing checkout, so these tests cover
# exactly what ships under the named version.
rahti = { version = "0.0.49", path = "../rahti/crates/rahti", default-features = false }

# The runtime, for the CLI's dependency on it. Same version as the workspace
# above, and bumped with it.
rahti-native = { version = "0.0.16", path = "crates/rahti-native" }
